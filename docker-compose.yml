
services:
  # Контейнер базы данных PostgreSQL
  db:
    image: postgres:16
    container_name: smartseat_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - s_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Контейнер веб-приложения Django
  web:
    build: .
    container_name: smartseat_web
    restart: always
    command: >
      bash -c "python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - s_network

networks:
  s_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume: